<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <defs>
    <style>
      .doodle {
        stroke: #c9bba8;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-opacity: 0.4;
        fill: none;
      }
      .doodle-fill {
        fill: #c9bba8;
        fill-opacity: 0.4;
        stroke: none;
      }
      @media (prefers-color-scheme: dark) {
        .doodle {
          stroke: #ffffff;
          stroke-opacity: 0.05;
        }
        .doodle-fill {
          fill: #ffffff;
          fill-opacity: 0.05;
        }
      }
    </style>
  </defs>

  <g class="doodle">
    <!-- 1. Chat bubble (top-left edge wrap at x=0 & x=400) -->
    <!-- Center at (0, 45) and (400, 45) -->
    <g transform="translate(0, 45) rotate(-12)">
      <path d="M-14 -10 C-14 -16, 14 -16, 14 -10 C14 -4, 6 -4, 2 -4 L-4 0 L-2 -4 C-10 -4, -14 -7, -14 -10 Z" />
      <path d="M-6 -10 L6 -10" />
      <path d="M-4 -7 L4 -7" />
    </g>
    <g transform="translate(400, 45) rotate(-12)">
      <path d="M-14 -10 C-14 -16, 14 -16, 14 -10 C14 -4, 6 -4, 2 -4 L-4 0 L-2 -4 C-10 -4, -14 -7, -14 -10 Z" />
      <path d="M-6 -10 L6 -10" />
      <path d="M-4 -7 L4 -7" />
    </g>

    <!-- 2. Phone handset at (65, 30) -->
    <g transform="translate(65, 30) rotate(25)">
      <path d="M-8 -12 C-10 -8, -10 8, -4 12 C-2 13, 1 12, 3 9 L1 6 C0 5, -1 5, -2 6 C-4 3, -4 0, -3 -2 C-2 -1, -1 -1, 0 -2 L-1 -5 C-3 -7, -5 -9, -8 -12 Z" />
    </g>

    <!-- 3. Heart at (140, 40) -->
    <g transform="translate(140, 40) rotate(-8)">
      <path d="M0 4 C-8 -4, -12 -10, -6 -14 C-2 -16, 0 -12, 0 -10 C0 -12, 2 -16, 6 -14 C12 -10, 8 -4, 0 4 Z" />
    </g>

    <!-- 4. Camera at (210, 35) -->
    <g transform="translate(210, 35) rotate(10)">
      <rect x="-12" y="-8" width="24" height="16" rx="3" />
      <circle cx="0" cy="0" r="5" />
      <path d="M-6 -8 L-4 -12 L4 -12 L6 -8" />
      <circle cx="7" cy="-4" r="1" class="doodle-fill" />
    </g>

    <!-- 5. Music note at (285, 45) -->
    <g transform="translate(285, 45) rotate(-15)">
      <ellipse cx="-6" cy="6" rx="4" ry="3" transform="rotate(-20 -6 6)" />
      <ellipse cx="6" cy="3" rx="4" ry="3" transform="rotate(-20 6 3)" />
      <path d="M-3 5 L-3 -8 L9 -11 L9 2" />
      <path d="M-3 -5 L9 -8" />
