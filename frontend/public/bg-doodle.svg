    <!-- 6. Paperclip at (355, 30) -->
    <g transform="translate(355, 30) rotate(40)">
      <path d="M-5 6 L-5 -6 C-5 -10, 1 -10, 1 -6 L1 8 C1 11, -3 11, -3 8 L-3 -3 C-3 -5, -1 -5, -1 -3 L-1 5" />
