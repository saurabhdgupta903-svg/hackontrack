    <g transform="translate(400, 0)"><circle cx="0" cy="0" r="1.5" class="doodle-fill" /></g>
    <g transform="translate(0, 400)"><circle cx="0" cy="0" r="1.5" class="doodle-fill" /></g>
    <g transform="translate(400, 400)"><circle cx="0" cy="0" r="1.5" class="doodle-fill" /></g>

    <!-- Fillers scattered evenly in spaces -->
    <path d="M20 70 L26 70 M23 67 L23 73" />
    <circle cx="95" cy="55" r="1.5" class="doodle-fill" />
    <path d="M175 45 L181 45 M178 42 L178 48" />
    <circle cx="250" cy="50" r="1.5" class="doodle-fill" />
    <path d="M320 25 L324 25 M322 23 L322 27" />
